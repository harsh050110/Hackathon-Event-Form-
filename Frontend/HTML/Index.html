<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#e6e9ff,#f6f7ff);
}
.container {
    width: 420px;
    margin: 40px auto;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
}
label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}
input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
.radio-group label {
    font-weight: normal;
}
button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    background: #4c4af5;
    color: white;
}
button:hover {
    background: #3a38d6;
}
</style>
</head>

<body>

<div class="container">
  <h1 style="color:black ">Algo<span style="color:red">रंग</span></h1>
<h2>Event Registration</h2>

<form id="basicForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>College</label>
<input type="text" id="college" required>

<label>Contact Number</label>
<input type="tel" id="phone" required>

<label>Year</label>
<div class="radio-group">
    <label><input type="radio" name="year" value="1" required> 1st Year</label>
    <label><input type="radio" name="year" value="2"> 2nd Year</label>
    <label><input type="radio" name="year" value="3"> 3rd Year</label>
    <label><input type="radio" name="year" value="4"> 4th Year</label>
</div>

<label>Select Event
  (Can only select 1 either Technical, Cultural or Game event, DJ night is open for all)<br>
(Participants of Technical, Cultural and Game event are accessible to DJ night,<br> but not participants of those events who want to take part in DJ night have to register separately)
</label>
<div class="radio-group">
    <label><input type="radio" name="event" value="TECH" required> Technical Event</label>
    <label><input type="radio" name="event" value="CULTURAL"> Cultural Event</label>
    <label><input type="radio" name="event" value="GAME"> Games</label>
    <label><input type="radio" name="event" value="DJ"> DJ Night</label>
</div>

<button type="submit">Next</button>
</form>

</div>


<script src="../JS/form.js"></script>

</body>
</html>
